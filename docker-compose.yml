services:
  control-plane:
    build: .
    command: uvicorn aegis.main:app --host 0.0.0.0 --port 8000
    env_file:
      - path: .env
        required: false
    volumes:
      - aegis-data:/data
    depends_on:
      lab-api:
        condition: service_healthy
    # Readiness gate: /ready fails closed (503) when persistence is lost or a provider credential is
    # present, so the orchestrator never routes to or gates a rollout on an unready control plane.
    # urlopen raises on the 503, which marks the container unhealthy — exactly the intended signal.
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready')"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [security-lab]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

  lab-api:
    build: .
    command: uvicorn lab_api.main:app --host 0.0.0.0 --port 8001
    expose: ["8001"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"]
      interval: 3s
      timeout: 2s
      retries: 10
    networks: [security-lab]
    read_only: true
    tmpfs: [/tmp]
    security_opt: [no-new-privileges:true]

networks:
  security-lab:
    internal: true

volumes:
  aegis-data:
