# Optional loopback-only ingress gateway. It is the only service on the host-ingress bridge and
# also joins the internal application network. The host publication is pinned to 127.0.0.1.
services:
  dashboard:
    image: nginx:1.28-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/dashboard-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks: [dashboard-ingress, security-lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 64
    restart: unless-stopped
    stop_grace_period: 15s
networks:
  dashboard-ingress: {}
