# Optional ingress-only gateway. Review before enabling: it adds a second network only to the proxy.
services:
  dashboard:
    image: nginx:1.28-alpine
    user: "101:101"
    ports:
      - "127.0.0.1:8000:8080"
    volumes:
      - ./deploy/dashboard-nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - control-plane
    networks: [dashboard-ingress, security-lab]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
networks:
  dashboard-ingress: {}
