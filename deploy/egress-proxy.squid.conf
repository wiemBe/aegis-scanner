# Dedicated provider egress proxy.
#
# This proxy is the ONLY component attached to an egress-capable network. It enforces a
# destination allowlist that permits nothing except an HTTPS CONNECT tunnel to
# api.openai.com:443. Every other hostname, IP literal, port, and HTTP method is denied by
# default. It holds no API key and terminates no TLS: the gateway's TLS session to
# api.openai.com passes through the CONNECT tunnel opaquely, so certificate verification stays
# end-to-end between the gateway and the provider.
#
# Limitation (documented in docs/phase-0.3.md): this is HOSTNAME-based allowlisting. Squid
# matches the literal host in the CONNECT request and then resolves it via DNS; it does not pin
# the provider's IP addresses. A poisoned/rebinding answer for api.openai.com, or a future change
# to that hostname's addresses, is not caught here. IP-literal CONNECTs are rejected, but the
# name->address binding is trusted.

http_port 3128

# Access-control primitives.
acl openai_host dstdomain api.openai.com
acl https_port port 443
acl CONNECT method CONNECT

# 1. No plain proxying at all: reject every non-CONNECT method (GET/POST/HEAD/...).
http_access deny !CONNECT
# 2. CONNECT is only allowed to port 443 (blocks api.openai.com:80 and any other port).
http_access deny CONNECT !https_port
# 3. Allow the single permitted destination.
http_access allow CONNECT openai_host https_port
# 4. Default deny: other hostnames, direct-IP CONNECTs, and anything else fall through to here.
http_access deny all

# No caching; this proxy only relays tunnels.
cache deny all

# Squid runs as the unprivileged 'proxy' user; log to its writable dirs (not /dev/stdout, which
# that user cannot open). The proxy never sees the API key regardless: it is inside the encrypted
# CONNECT tunnel. Access-log lines record only "CONNECT api.openai.com:443".
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid

# Keep responses terse; do not advertise the internal hostname.
httpd_suppress_version_string on
via off
forwarded_for delete

# Fail fast rather than hang if a destination is unreachable.
connect_timeout 10 seconds
