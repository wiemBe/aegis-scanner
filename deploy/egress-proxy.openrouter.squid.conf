# OpenRouter-only CONNECT proxy. TLS remains end-to-end between llm-gateway and OpenRouter, so
# this process never sees the API key, prompts, schemas or responses. Hostname DNS resolution is
# trusted; direct-IP tunnels, alternate hosts, non-TLS ports and non-CONNECT methods are denied.

http_port 3128

acl openrouter_host dstdomain openrouter.ai
acl https_port port 443
acl CONNECT method CONNECT

http_access deny !CONNECT
http_access deny CONNECT !https_port
http_access allow CONNECT openrouter_host https_port
http_access deny all

cache deny all
access_log /var/log/squid/access.log squid
cache_log /var/log/squid/cache.log
pid_filename /tmp/squid.pid
httpd_suppress_version_string on
via off
forwarded_for delete
connect_timeout 10 seconds
