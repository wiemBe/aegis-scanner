pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 128; }
http {
    # Raw Nginx access logs include query strings. Application-owned bounded structured logs are the
    # only request log, so the proxy access log is disabled instead of duplicating unsafe material.
    access_log off;
    server_tokens off;
    client_body_temp_path /tmp/client_body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    client_max_body_size 4k;
    server {
        listen 8080;
        location / {
            proxy_pass http://control-plane:8000;
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_connect_timeout 3s;
            proxy_read_timeout 65s;
            proxy_send_timeout 10s;
            proxy_set_header Host control-plane;
            proxy_set_header Connection "";
        }
    }
}
