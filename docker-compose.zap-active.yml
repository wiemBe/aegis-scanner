# Phase 1.5 controlled ZAP active reflected-XSS overlay (SYNTHETIC_LAB only).
#
#   docker compose -f docker-compose.yml -f docker-compose.zap-active.yml up --build
#
# Topology (every network is internal: true — no gateway, no internet, no host access):
#
#   control-plane --[active-rpc]--> zap-active-runner --[active-egress]--> zap-active-scope-guard
#                                            |                                --[active-target]--> lab-api
#                                            +--[active-admission]--> zap-active-admission
#
# - zap-active-runner joins ONLY active-rpc + active-egress. active-egress contains nothing but the
#   active scope guard, so ZAP has no route to the target, the LLM gateway, Ollama, the passive/
#   Nuclei/Beast runners, the dashboard, the host or the internet. Every ZAP request — including the
#   active-scan payloads on the projected query parameter — must pass through the guard. OAST has no
#   route out, so its callbacks are inert.
# - zap-active-scope-guard joins ONLY active-egress + active-target. In ACTIVE mode it forwards only
#   armed GET/HEAD requests to the approved origin+path, allows a query string only on the projected
#   parameter, enforces the hard request budget, and counts traffic independently of ZAP.
# - The Phase 1.3 passive profile, image and guard (aegis-zap-scope-guard:1.3.0) are untouched.
# - zap-active-admission is the root-owned lease authority. It joins ONLY active-admission, has no
#   route to the target, the guard or the internet, and stores the armed/consumed/revoked registry
#   in a root-owned 0700 tmpfs that the unprivileged ZAP process (a different container) cannot
#   reach. It holds the only runner-side copy of the lease-signing secret; the runner supervisor
#   holds only a client credential, and ZAP's child environment is built from scratch so the engine
#   receives neither.
# - No service publishes a port, mounts a host path or the Docker socket. The only credentials are
#   the lease-signing secret and the admission client credential, both supplied from the operator's
#   shell (never a committed file) and mounted ONLY where the comments above say they may exist.
#
# Required before `up` (compose fails closed if either is unset):
#   export AEGIS_ZAP_ACTIVE_LEASE_SECRET="$(openssl rand -hex 32)"
#   export AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT="$(openssl rand -hex 32)"
#   export AEGIS_ZAP_ACTIVE_RUNNER_CLIENT="$(openssl rand -hex 32)"
#   export AEGIS_ZAP_ACTIVE_OPERATOR_BOOTSTRAP_SECRET="$(openssl rand -hex 32)"
#   export AEGIS_ZAP_GUARD_CONTROL_SECRET="$(openssl rand -hex 32)"

services:
  control-plane:
    environment:
      ZAP_ACTIVE_ENABLED: "true"
      ZAP_ACTIVE_RUNNER_URL: http://zap-active-runner:8093
      # The controller signs leases with this. The ONLY other place it may exist is the root-owned
      # admission component. It is never given to ZAP, the scope guard, the console, an audit
      # record, a report or an evidence artifact, and the control plane refuses to start when
      # ZAP_ACTIVE_ENABLED is true and this is missing, empty or a placeholder.
      ZAP_ACTIVE_LEASE_SECRET: ${AEGIS_ZAP_ACTIVE_LEASE_SECRET:?set AEGIS_ZAP_ACTIVE_LEASE_SECRET (>=32 bytes) in the operator shell}
      AEGIS_ZAP_ACTIVE_OPERATOR_BOOTSTRAP_SECRET: ${AEGIS_ZAP_ACTIVE_OPERATOR_BOOTSTRAP_SECRET:?set AEGIS_ZAP_ACTIVE_OPERATOR_BOOTSTRAP_SECRET (>=32 bytes) in the operator shell}
      AEGIS_ZAP_ACTIVE_RUNNER_CLIENT: ${AEGIS_ZAP_ACTIVE_RUNNER_CLIENT:?set AEGIS_ZAP_ACTIVE_RUNNER_CLIENT (>=32 bytes) in the operator shell}
    networks:
      security-lab: {}
      active-rpc: {}
    depends_on:
      zap-active-runner:
        condition: service_healthy

  lab-api:
    networks:
      security-lab: {}
      active-target: {}

  zap-active-scope-guard:
    build:
      context: .
      dockerfile: deploy/zap-guard/Dockerfile
    image: aegis-zap-scope-guard:1.5.0
    user: "10003:10003"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.5
    ulimits:
      nofile: {soft: 256, hard: 256}
    stop_grace_period: 5s
    expose: ["3128", "3129"]
    environment:
      AEGIS_ZAP_GUARD_CONTROL_SECRET: ${AEGIS_ZAP_GUARD_CONTROL_SECRET:?set AEGIS_ZAP_GUARD_CONTROL_SECRET (>=32 bytes) in the operator shell}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3129/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [active-egress, active-target]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}

  zap-active-admission:
    build:
      context: .
      dockerfile: deploy/zap-active-admission/Dockerfile
    image: aegis-zap-active-admission:1.5.0
    # Deliberately root: the lease registry must be root-owned and unreadable to the unprivileged
    # ZAP process. Everything else is narrowed to compensate.
    user: "0:0"
    read_only: true
    volumes:
      - admission-state:/admission
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 96m
    cpus: 0.5
    ulimits:
      nofile: {soft: 256, hard: 256}
    stop_grace_period: 5s
    expose: ["8095"]
    environment:
      AEGIS_ZAP_ACTIVE_LEASE_SECRET: ${AEGIS_ZAP_ACTIVE_LEASE_SECRET:?set AEGIS_ZAP_ACTIVE_LEASE_SECRET (>=32 bytes) in the operator shell}
      AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT: ${AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT:?set AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT (>=32 bytes) in the operator shell}
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/health')"]
      interval: 3s
      timeout: 2s
      retries: 20
    networks: [active-admission]
    logging:
      driver: json-file
      options: {max-size: "1m", max-file: "2"}

  zap-active-runner:
    build:
      context: .
      dockerfile: deploy/zap-runner-active/Dockerfile
    image: aegis-zap-active-runner:1.5.0
    user: "10002:10002"
    read_only: true
    tmpfs:
      - /work:size=512m,mode=0700,uid=10002,gid=10002,nosuid,nodev,noexec
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 1536m
    cpus: 2.0
    ulimits:
      nofile: {soft: 1024, hard: 1024}
    stop_grace_period: 10s
    expose: ["8093"]
    environment:
      # The supervisor holds ONLY the admission client credential, never the signing secret. It is
      # removed from the environment at boot and never reaches the ZAP child, whose environment is
      # constructed from scratch rather than inherited.
      AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT: ${AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT:?set AEGIS_ZAP_ACTIVE_ADMISSION_CLIENT (>=32 bytes) in the operator shell}
      AEGIS_ZAP_ACTIVE_RUNNER_CLIENT: ${AEGIS_ZAP_ACTIVE_RUNNER_CLIENT:?set AEGIS_ZAP_ACTIVE_RUNNER_CLIENT (>=32 bytes) in the operator shell}
      AEGIS_ZAP_ACTIVE_ADMISSION_URL: http://zap-active-admission:8095
      AEGIS_ZAP_GUARD_CONTROL_SECRET: ${AEGIS_ZAP_GUARD_CONTROL_SECRET:?set AEGIS_ZAP_GUARD_CONTROL_SECRET (>=32 bytes) in the operator shell}
    depends_on:
      zap-active-scope-guard:
        condition: service_healthy
      zap-active-admission:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8093/health')"]
      interval: 5s
      timeout: 3s
      retries: 40
      start_period: 120s
    networks: [active-rpc, active-egress, active-admission]
    logging:
      driver: json-file
      options: {max-size: "2m", max-file: "2"}

networks:
  active-rpc:
    name: aegis-active-rpc
    internal: true
  active-egress:
    name: aegis-active-egress
    internal: true
  active-target:
    name: aegis-active-target
    internal: true
  active-admission:
    name: aegis-active-admission
    internal: true

volumes:
  admission-state:
    name: aegis-zap-active-admission-state
