[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "aegis-ai-security-lab"
version = "0.2.0"
description = "Guardrailed AI-driven API security testing lab"
requires-python = ">=3.12"
dependencies = [
  "cryptography==46.0.5",
  "fastapi==0.116.1",
  "httpx==0.28.1",
  "jinja2==3.1.6",
  "pydantic-settings==2.10.1",
  "pyyaml==6.0.3",
  "uvicorn[standard]==0.35.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "pytest-asyncio==1.1.0",
  "ruff==0.12.9",
  "types-PyYAML==6.0.12.20250915",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
aegis = [
  "templates/*.html",
  "static/*.js",
  "static/*.css",
  "console/*.html",
  "console/assets/*.js",
  "console/assets/*.css",
]
aegis_nuclei = ["manifest.json", "py.typed"]
nuclei_runner = ["py.typed"]
aegis_zap = ["manifest.json", "sources/*.json", "py.typed"]
aegis_zap_active = ["manifest.json", "countersign.json", "operator-public-key.hex", "sources/*.json", "py.typed"]
zap_runner = ["py.typed"]
zap_active_runner = ["py.typed"]
zap_active_admission = ["py.typed"]
zap_guard = ["py.typed"]
beast_sandbox = ["py.typed"]
beast_gateway = ["py.typed"]
aegis_range = ["openapi/*.json", "fixtures/ops/**/*.txt", "fixtures/cloud/*.txt", "py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
ignore = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = [
  "aegis",
  "lab_api",
  "aegis_nuclei",
  "nuclei_runner",
  "aegis_zap",
  "aegis_zap_active",
  "zap_runner",
  "zap_active_runner",
  "zap_active_admission",
  "zap_guard",
  "beast_sandbox",
  "beast_gateway",
  "aegis_range",
]
